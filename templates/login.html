<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Professor Login</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 360px;
                margin: 80px auto;
                padding: 16px;
                background: #f5f5f0;
            }

            label {
                width: 100%;
                box-sizing: border-box;
                padding: 10px;
                font-size: 16px;
                border: 1px solid #999;
                border-radius: 6px;
                margin-bottom: 12px;
            }

            button {
                padding: 10px 20px;
                font-size: 16px;
                border: none;
                border-radius: 6px;
                background: #333;
                color: white;
                cursor: pointer;
            }

            .error {
                color: #d32f2f;
            }
        </style>
        <body>
            <h1>Professor login</h1>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form method="post">
                <label for="password">Password</label>
                <input id="password" name="password" type="pasword" autofocus required>
                <button type="submit">Log in</button>
            </form>
        </body>
    </head>
</html>
