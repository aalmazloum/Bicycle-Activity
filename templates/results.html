<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Bicycle Drawings: Results</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 1100px;
                margin: 0 auto;
                padding: 16px;
                background: #f5f5f0;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 16px;
            }

            .card {
                background: white;
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 8px;
            }

            .card img {
                width: 100%;
                aspect-ratio: 4 / 3;
                border: 1px solid #eee;
                background: white;
                cursor: zoom-in;
            }

            dialog {
                border: none;
                border-radius: 12px;
                padding: 0px;
                width: min(90vw, 900px);
            }

            dialog::backdrop {
                background: rgba(0, 0, 0, 0.7);
            }

            .viewer-content {
                padding: 16px;
            }

            #viewer-img {
                width: 100%;
                aspect-ratio: 4 / 3;
                background: white;
                border: 1px solid #eee;
            }

            button {
                padding: 10px 20px;
                font-size: 16px;
                border: none;
                border-radius: 6px;
                background: #333;
                color: white;
                cursor: pointer;
            }

            .name {
                font-weight: 600;
                margin: 6px 0 0;
            }

            .time {
                color: #666;
                font-size: 13px;
                margin: 0;
            }

            .names-hidden .card .name {
                visibility: hidden;
            }

            .name-hidden #viewer-name {
                visibility: hidden;
            }

            .viewer-buttons {
                display: flex;
                gap: 8px;
            }

            .button-link {
                display: inline-block;
                padding: 10px 20px;
                font-size: 16px;
                border-radius: 6px;
                background: #333;
                color: white;
                text-decoration: none;
            }

            .toolbar {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 16px;
            }

            .view-button {
                background: #ddd;
                color: #333;
            }

            .view-button.active {
                background: #333;
                color: white;
            }

            #overlay-view {
                text-align: center;
            }

            #overlay {
                width: 100%;
                max-width: calc((100vh - 220px) * 4 / 3);
                aspect-ratio: 4 / 3;
                background: white;
                border: 2px solid #333;
                border-radius: 8px;
            }

        </style>
    </head>
    <body class="names-hidden">
        <h1>Submissions</h1>
        <p>{{ submissions|length }} drawings submitted.</p>
        <div class="toolbar">
            <button id="show-grid" type="button" class="view-button active">Drawings</button>
            <button id="show-overlay" type="button" class="view-button">Overlay</button>
            <button id="toggle-names" type="button">Show names</button>
            <button id="refresh" type="button">Refresh</button>
            <a href="{{ url_for('results_csv') }}" class="button-link">Download CSV</a>
            <a href="{{ url_for('logout') }}" class="button-link">Log out</a>
        </div>
        <section id="grid-view">
            <div class="grid">
                {% for s in submissions %}
                    <div class="card">
                        <img src="{{ s['drawing'] }}" alt="Bicycle drawing by {{ s['name'] }}" data-name="{{ s['name'] }}">
                        <p class="name">{{ s['name'] }}</p>
                        <p class="time">{{ s['submitted_at'] }}</p>
                    </div>
                {% else %}
                    <p>No drawings yet.</p>
                {% endfor %}
            </div>
        </section>
        <section id="overlay-view" hidden>
            <canvas id="overlay" width="1600" height="1200"></canvas>
        </section>
        <dialog id="viewer">
            <div class="viewer-content">
                <img id="viewer-img" alt="">
                <p id="viewer-name" class="name"></p>
                <div class="viewer-buttons">
                    <button id="viewer-toggle-name" type="button">Hide name</button>
                    <button id="viewer-close" type="button">Close</button>
                </div>
            </div>
        </dialog>

        <script src="{{ url_for('static', filename='results.js') }}"></script>
    </body>
</html>
